<svg viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#f8f8f8" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="80" fill="url(#faberGradient)"/>
  
  <!-- Knight emblem -->
  <g transform="translate(100, 15)">
    <!-- Knight figure -->
    <path d="M-8 -5 L-5 -8 L0 -10 L5 -8 L8 -5 L8 0 L5 3 L0 5 L-5 3 L-8 0 Z" fill="#2d5016" stroke="#1a3009" stroke-width="0.5"/>
    <!-- Sword -->
    <line x1="0" y1="-8" x2="0" y2="-15" stroke="#2d5016" stroke-width="1"/>
    <!-- Shield -->
    <ellipse cx="0" cy="0" rx="3" ry="4" fill="#2d5016"/>
  </g>
  
  <!-- FABER-CASTELL Text -->
  <text x="100" y="45" font-family="Times, serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2d5016">FABER-CASTELL</text>
  
  <!-- Subtitle -->
  <text x="100" y="60" font-family="Times, serif" font-size="8" text-anchor="middle" fill="#2d5016" font-style="italic">since 1761</text>
</svg>